name: "Chromatic Cypress"

on: push

jobs:
  cypress:
    name: Run Cypress
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-24.19.0-chrome-151.0.7922.75-1-ff-153.0.3-edge-151.0.4129.59-1
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: Install dependencies
        # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm ci
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        env:
          ELECTRON_EXTRA_LAUNCH_ARGS: "--remote-debugging-port=9222"
        with:
          start: npm run dev
      - uses: actions/upload-artifact@v7
        with:
          # Chromatic automatically defaults to the cypress/downloads directory.
          # Replace with the path to your custom directory and adjust the CHROMATIC_ARCHIVE_LOCATION environment variable accordingly.
          name: test-results
          path: ./cypress/downloads
          retention-days: 30
  chromatic:
    name: Run Chromatic
    needs: cypress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: Install dependencies
        # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm ci
      - name: Download Cypress test results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ./cypress/downloads
      - name: Run Chromatic
        uses: chromaui/action-canary@v18.5.1--canary.1465.32835334792.0
        with:
          # ⚠️ Enable Cypress
          cypress: true
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_CYPRESS_PROJECT_TOKEN }}
